$kind: http-request
name: Get My Rooms
url: https://localhost:7081/api/chathistory/user/mine/rooms
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const responseData = pm.response.json();

      Object.entries(responseData).forEach(([key, value]) => {
          pm.collectionVariables.set(value, key);
      });
    language: text/javascript
order: 870
