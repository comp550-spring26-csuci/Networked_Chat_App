$kind: http-request
name: CreateAndLoginUser
url: https://localhost:7081/api/test/seed-user?UserName={{username}}
method: POST
queryParams:
  UserName: "{{username}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      const responseJson = pm.response.json();

      const connectionId = responseJson.token;

      pm.collectionVariables.set("access_token",connectionId)
    language: text/javascript
  - type: beforeRequest
    code: |+
      const collectionName = pm.execution.location[0];

      let username = collectionName;

      pm.collectionVariables.set("username", username)

    language: text/javascript
examples: .resources/CreateAndLoginUser.resources/examples
order: 547
