$kind: http-request
url: https://{{URL.host}}/api/chathistory/user/mine/rooms
method: GET
scripts:
  - type: afterResponse
    code: |-
      Object.entries(pm.response.json()).forEach(([key, value]) => {
          pm.collectionVariables.set(value, key);
      });
    language: text/javascript
order: 2000
