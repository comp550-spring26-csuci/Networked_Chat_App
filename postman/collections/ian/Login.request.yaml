$kind: http-request
url: https://{{URL.host}}/api/testdm/seed-user?UserName={{username}}&OverWrite=false
method: POST
queryParams:
  UserName: "{{username}}"
  OverWrite: "false"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.collectionVariables.set("optional_user_id", pm.response.json().userId)

      pm.collectionVariables.set("access_token", pm.response.json().token);

      pm.collectionVariables.set("target_chatroom_id", "");

      pm.collectionVariables.set("optional_room_name", "")

      pm.collectionVariables.set("message", "");
    language: text/javascript
  - type: beforeRequest
    code: pm.collectionVariables.set("username", pm.execution.location[0]);
    language: text/javascript
order: 1000
